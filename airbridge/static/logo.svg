<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="AirBridge">
  <g transform="translate(4 4)">
    <rect width="88" height="88" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <!-- bridge arch carrying radio waves between two towers -->
    <path d="M16 62 L16 30 M72 62 L72 30" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
    <path d="M16 46 Q44 14 72 46" fill="none" stroke="#e3a008" stroke-width="5" stroke-linecap="round"/>
    <path d="M26 58 Q44 34 62 58" fill="none" stroke="#e3a008" stroke-width="4.5" stroke-linecap="round" opacity=".75"/>
    <path d="M10 66 L78 66" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="44" cy="60" r="6" fill="#3fb950"/>
  </g>
  <text x="112" y="58" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="44" font-weight="700"
        fill="#e6edf3" letter-spacing="-0.5">Air<tspan fill="#e3a008">Bridge</tspan></text>
  <text x="114" y="82" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8b949e"
